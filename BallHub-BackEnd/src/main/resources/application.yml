spring:
  application:
    name: ballhub-backend

  # Database Configuration
  datasource:
    url: jdbc:sqlserver://ballhubdb.database.windows.net:1433;database=BallHub;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
    username: ballhubAdmin
    password: Password@1
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  # Servlet Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Mail Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: phucnd2611@gmail.com
    password: jbfe xyad iqsk gzwz
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# JWT Configuration
jwt:
  secret: ballhub-secret-key-2024-this-is-a-very-long-secret-key-for-jwt-token-generation
  access-token-expiration: 3600000 # 15 minutes (in milliseconds)
  refresh-token-expiration: 604800000 # 7 days (in milliseconds)

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# Logging
logging:
  level:
    com.ballhub: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
